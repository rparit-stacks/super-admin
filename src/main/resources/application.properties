spring.application.name=super-admin

# ===== Server =====
server.port=${SUPER_ADMIN_PORT:8090}

# ===== MongoDB (Atlas) =====
# Password is injected via env var SUPER_ADMIN_MONGO_PASSWORD (do NOT hardcode it here).
# The whole URI can also be overridden via SUPER_ADMIN_MONGO_URI.
spring.data.mongodb.uri=${SUPER_ADMIN_MONGO_URI:mongodb+srv://rbusiness1999_db_user:C9MGSTcmcUfJc7LN@cluster0.k3h3hib.mongodb.net/super_admin_db?retryWrites=true&w=majority&appName=Cluster0}
spring.data.mongodb.auto-index-creation=true

# ===== JWT (super-admin login) =====
# Override in production via env var. Must be a long random string (>= 256 bits).
super-admin.jwt.secret=${SUPER_ADMIN_JWT_SECRET:CHANGE_ME_super_admin_dev_secret_please_override_in_prod_0123456789}
super-admin.jwt.expiration-ms=${SUPER_ADMIN_JWT_EXPIRATION_MS:86400000}

# ===== Shared API key: store backends authenticate to /api/store-api/* with this =====
super-admin.store-api-key=${SUPER_ADMIN_STORE_API_KEY:63f4945d921d599f27ae4fdf5bada3f1}

# ===== Default super-admin credentials (seeded on first boot if no admin exists) =====
super-admin.seed.username=${SUPER_ADMIN_USERNAME:superadmin}
super-admin.seed.password=${SUPER_ADMIN_PASSWORD:superadmin123}

# ===== Default store to register on first boot (B-Nutri) =====
super-admin.seed.store.name=${SEED_STORE_NAME:B-Nutri}
super-admin.seed.store.api-base-url=${SEED_STORE_API_URL:https://api.bnutritionmart.in}

# ===== Second seeded store (Studio Sara) — its own per-store API key & base URL =====
super-admin.seed.store2.name=${SEED_STORE2_NAME:Studio Sara}
super-admin.seed.store2.code=${SEED_STORE2_CODE:studio-sara}
super-admin.seed.store2.api-base-url=${SEED_STORE2_API_URL:https://studiosara.cloud}
super-admin.seed.store2.website-url=${SEED_STORE2_WEBSITE_URL:https://www.studiosara.in}
# Studio Sara's store API key (must be UNIQUE per store — apiKey has a unique index, so it
# cannot equal B-Nutri's key). Based on the shared key with a per-store suffix.
# Must match Sara backend's super-admin.store-api-key.
super-admin.seed.store2.api-key=${SEED_STORE2_API_KEY:63f4945d921d599f27ae4fdf5bada3f1_sara}

# ===== Liveness probe =====
super-admin.liveness.health-path=${SUPER_ADMIN_HEALTH_PATH:/api/health}
super-admin.liveness.timeout-ms=${SUPER_ADMIN_LIVENESS_TIMEOUT_MS:4000}
# How often the scheduler re-pings all stores (ms).
super-admin.liveness.interval-ms=${SUPER_ADMIN_LIVENESS_INTERVAL_MS:60000}

# ===== Logging =====
logging.level.com.sara.superadmin=INFO
